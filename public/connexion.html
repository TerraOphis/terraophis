<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification | Terraophis</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
</head>
<body class="beige-theme">

    <nav class="navbar" id="main-navbar"></nav>

    <main class="login-page">
        <div class="auth-wrapper">
            
            <div class="auth-card">
                <h2>Déjà client ?</h2>
                <p>Connectez-vous à votre espace personnel.</p>
                
                <button id="btnGoogleLogin" class="btn-buy" style="background-color: #fff; color: #333; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                    Connexion avec Google
                </button>

                <div class="auth-separator">
                    <hr><span>OU</span><hr>
                </div>
                
                <form id="emailLoginForm">
                    <input type="email" id="loginEmail" placeholder="Adresse e-mail" required>
                    <input type="password" id="loginPassword" placeholder="Mot de passe" required>
                    <button type="submit" class="btn-buy" style="width: 100%;">SE CONNECTER</button>
                </form>
            </div>

            <div class="auth-card">
                <h2>Nouveau client ?</h2>
                <p>Créez votre compte en quelques secondes.</p>
                
                <button id="btnGoogleSignUp" class="btn-buy" style="background-color: #fff; color: #333; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                    Inscription avec Google
                </button>

                <div class="auth-separator">
                    <hr><span>OU</span><hr>
                </div>

                <form id="emailSignUpForm">
                    <div class="auth-form-row">
                        <input type="text" id="signUpFirstName" placeholder="Prénom" required>
                        <input type="text" id="signUpLastName" placeholder="Nom" required>
                    </div>
                    <input type="email" id="signUpEmail" placeholder="Adresse e-mail" required>
                    <input type="password" id="signUpPassword" placeholder="Mot de passe (6 carac. min)" required minlength="6">
                    <button type="submit" class="btn-buy" style="width: 100%;">CRÉER MON COMPTE</button>
                </form>
            </div>

        </div>
    </main>

    <footer id="main-footer"></footer>

    <script type="module" src="app.js"></script>
    <script type="module">
        import { auth, db } from './firebase-config.js';
        // NOUVEAU : Importation des fonctions de création et de connexion par email
        import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = '/profil.html';
        });

        // Fonction centralisée pour Google (sert pour connexion ET inscription)
        const handleGoogleAuth = async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                await setDoc(doc(db, "users", result.user.uid), {
                    name: result.user.displayName,
                    email: result.user.email,
                    updatedAt: serverTimestamp()
                }, { merge: true });
                window.location.href = '/profil.html';
            } catch (error) {
                console.error("Erreur d'authentification :", error);
                alert("Authentification Google annulée ou échouée.");
            }
        };

        document.getElementById('btnGoogleLogin').addEventListener('click', handleGoogleAuth);
        document.getElementById('btnGoogleSignUp').addEventListener('click', handleGoogleAuth);

        // NOUVEAU : Logique de connexion par Email
        document.getElementById('emailLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Connexion... ⏳';

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // La redirection est gérée par onAuthStateChanged en haut
            } catch (error) {
                console.error("Erreur connexion :", error);
                alert("E-mail ou mot de passe incorrect.");
                btn.disabled = false;
                btn.textContent = 'SE CONNECTER';
            }
        });

        // NOUVEAU : Logique de création de compte par Email
        document.getElementById('emailSignUpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Création... ⏳';

            const firstName = document.getElementById('signUpFirstName').value;
            const lastName = document.getElementById('signUpLastName').value;
            const email = document.getElementById('signUpEmail').value;
            const password = document.getElementById('signUpPassword').value;

            try {
                // 1. Création dans Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Ajout du prénom/nom au profil Auth
                await updateProfile(user, {
                    displayName: `${firstName} ${lastName}`
                });

                // 3. Sauvegarde dans Firestore pour avoir une trace en base de données
                await setDoc(doc(db, "users", user.uid), {
                    name: `${firstName} ${lastName}`,
                    email: user.email,
                    updatedAt: serverTimestamp()
                }, { merge: true });

                alert("Compte créé avec succès ! 🌿");
                // La redirection est gérée par onAuthStateChanged
            } catch (error) {
                console.error("Erreur inscription :", error);
                let errorMsg = "Erreur lors de l'inscription.";
                if (error.code === 'auth/email-already-in-use') errorMsg = "Cette adresse e-mail est déjà utilisée.";
                alert(errorMsg);
                btn.disabled = false;
                btn.textContent = 'CRÉER MON COMPTE';
            }
        });
    </script>
</body>
</html>
