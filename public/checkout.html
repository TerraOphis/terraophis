<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification de la commande | Terraophis</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
</head>
<body class="beige-theme">

    <nav class="navbar" id="main-navbar"></nav>

    <main class="container">
        <div class="checkout-wrapper">
            
            <div>
    <form id="checkoutForm">
        <div class="checkout-step">
            <h2><span class="checkout-step-number">1</span> Vos coordonnées</h2>
            
            <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
                <input type="text" id="chkName" placeholder="Prénom et Nom" required style="padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
                <input type="tel" id="chkPhone" placeholder="Numéro de téléphone" required style="padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
            </div>

            <h3 style="font-size: 1rem; color: var(--accent-brown); margin-bottom: 15px; border-top: 1px solid #eee; padding-top: 15px;">Adresse de livraison</h3>
            <div id="addressFieldsContainer" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" id="chkLine1" placeholder="Adresse (N°, rue...)" required style="padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
                <input type="text" id="chkLine2" placeholder="Appartement, bâtiment (Optionnel)" style="padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
                    <input type="text" id="chkPostal" placeholder="Code postal" required style="padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
                    <div style="position: relative; width: 100%;">
                        <input type="text" id="chkCity" placeholder="Ville" required style="padding: 12px; border: 1px solid #ddd; border-radius: 6px; width: 100%; box-sizing: border-box;" autocomplete="off">
                        <ul id="cityDropdown" style="display: none; position: absolute; width: 100%; max-height: 200px; overflow-y: auto; background: white; border: 1px solid #ddd; border-radius: 6px; z-index: 1000; padding: 0; margin: 0; list-style: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);"></ul>
                    </div>
                </div>
                <select id="chkCountry" required style="padding: 12px; border: 1px solid #ddd; border-radius: 6px; background: white;">
                    <option value="FR">France</option>
                    <option value="BE">Belgique</option>
                    <option value="CH">Suisse</option>
                    <option value="LU">Luxembourg</option>
                </select>
            </div>
        </div>

        <div id="inlineWeatherAlert" style="display: none; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid var(--border-light); text-align: center; transition: all 0.3s ease;">
            <h3 id="inlineWeatherTitle" style="margin-top: 0; font-family: 'Playfair Display', serif; margin-bottom: 10px;"></h3>
            <p id="inlineWeatherText" style="margin: 0; font-size: 0.95rem; line-height: 1.5; color: var(--accent-brown);"></p>
        </div>

        <div class="checkout-step">
            <h2><span class="checkout-step-number">2</span> Mode de livraison</h2>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <label class="shipping-option">
                    <input type="radio" name="shippingMethod" value="colissimo" checked>
                    <span><strong>Colissimo (2 jours ouvrés)</strong> - 8.90 € <span id="colissimoFreeText" style="color: #4d5d30; font-weight: bold; display: none;">(OFFERT)</span><br><small>Départ Lun au Mer. Offert dès 100€ d'achat.</small></span>
                </label>
                <label class="shipping-option">
                    <input type="radio" name="shippingMethod" value="chrono18">
                    <span><strong>Chrono 18 (Express)</strong> - 14.90 €<br><small>Demain avant 18h. Départ Lun au Jeu.</small></span>
                </label>
                <label class="shipping-option">
                    <input type="radio" name="shippingMethod" value="retrait">
                    <span>
                        <strong>Retrait sur place (Gratuit)</strong><br>
                        <small style="display: flex; flex-direction: column; gap: 5px; margin-top: 3px;">
                            Pink Tropical, Bouillargues. Contact par mail pour RDV.
                            <a href="https://www.google.com/maps/search/?api=1&query=Pink+Tropical,+KM4+CENTER,+Route+d'Arles,+30230+Bouillargues" target="_blank" style="color: #4d5d30; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; width: fit-content;" onclick="event.stopPropagation();">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                Voir sur la carte
                            </a>
                        </small>
                    </span>
                </label>
            </div>
        </div>

        <div class="checkout-step">
            <h2><span class="checkout-step-number">3</span> Paiement sécurisé</h2>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 20px;">Redirection vers l'interface sécurisée Stripe.</p>
            <label style="display: flex; gap: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 20px;">
                <input type="checkbox" required>
                <span>Je m'engage à fournir des conditions de vie adaptées au bien-être de l'animal.</span>
            </label>
            <button type="submit" id="btnFinalPay" class="btn-buy" style="width: 100%; font-size: 1.1rem; padding: 18px;">PAYER MA COMMANDE</button>
        </div>
    </form>
</div>


            <div>
                <div class="checkout-summary">
                    <h2 style="font-family: 'Playfair Display', serif; margin-top: 0;">Résumé</h2>
                    <div id="checkoutItems">
                        <p>Chargement du panier...</p>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: #666;">
                            <span>Sous-total</span>
                            <span id="chkSubtotal">0.00 €</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #666;">
                            <span id="chkShippingLabel">Frais de port (Vivant / Isotherme)</span>
                            <span id="chkShipping">9.90 €</span>
                        </div>
                        <div class="summary-total">
                            <span>TOTAL</span>
                            <span id="chkTotal">0.00 €</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

<footer id="main-footer"></footer>

    <script type="module" src="app.js"></script>
    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc, collection, addDoc, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // NOUVEAU : Mise à jour des tarifs
        const HEAT_PACK_COST = 2.00; 
        let cart = [];
        let subtotal = 0;
        let isColdWeather = false; 
        let isHotWeather = false;  

        // NOUVEAU : Calcule le total en fonction du mode de livraison choisi
        const updateTotals = () => {
            const shippingMethod = document.querySelector('input[name="shippingMethod"]:checked').value;
            let currentShipping = 0;
            let shippingText = "Frais de port";

            // Gestion Colissimo Offert
            const freeColissimo = subtotal >= 100;
            const colissimoText = document.getElementById('colissimoFreeText');
            if (colissimoText) colissimoText.style.display = freeColissimo ? 'inline' : 'none';

            if (shippingMethod === 'colissimo') {
                currentShipping = freeColissimo ? 0 : 8.90;
                shippingText = freeColissimo ? "Colissimo (Offert)" : "Livraison Colissimo";
            } else if (shippingMethod === 'chrono18') {
                currentShipping = 14.90;
                shippingText = "Livraison Express Chrono 18";
            } else if (shippingMethod === 'retrait') {
                currentShipping = 0;
                shippingText = "Retrait Pink Tropical";
            }

            // Ajout chaufferette uniquement si ce n'est pas un retrait
            if (isColdWeather && shippingMethod !== 'retrait') {
                currentShipping += 2.00; // Nouveau prix : 2€
                shippingText += " + Chaufferette";
            }

            const shippingLabel = document.getElementById('chkShippingLabel');
            if (shippingLabel) shippingLabel.textContent = shippingText;
            
            document.getElementById('chkShipping').textContent = currentShipping.toFixed(2) + ' €';
            document.getElementById('chkTotal').textContent = (subtotal + currentShipping).toFixed(2) + ' €';
        };

        // 2. ÉCOUTEURS POUR LE CHANGEMENT DE MODE
        document.querySelectorAll('input[name="shippingMethod"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const isRetrait = e.target.value === 'retrait';
                const addressContainer = document.getElementById('addressFieldsContainer');
                const alertBox = document.getElementById('inlineWeatherAlert');

                if (isRetrait) {
                    // En mode retrait, on peut masquer ou griser l'adresse
                    addressContainer.style.opacity = '0.5';
                    addressContainer.querySelectorAll('input, select').forEach(i => i.required = false);
                    alertBox.style.display = 'none'; // Pas besoin d'alerte transport si retrait
                } else {
                    addressContainer.style.opacity = '1';
                    addressContainer.querySelectorAll('input, select').forEach(i => {
                        if(i.id !== 'chkLine2') i.required = true;
                    });
                    // On relance la météo si une ville est déjà là
                    if (document.getElementById('chkCity').value) window.checkWeather();
                }
                updateTotals();
            });
        });

        // NOUVEAU : Écouteur pour masquer/afficher l'adresse selon la livraison
        document.addEventListener('DOMContentLoaded', () => {
            const shippingRadios = document.querySelectorAll('input[name="shippingMethod"]');
            const addressContainer = document.getElementById('addressFieldsContainer');
            const addressInputs = addressContainer.querySelectorAll('input, select');
            
            shippingRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'retrait') {
                        addressContainer.style.display = 'none';
                        addressInputs.forEach(input => input.removeAttribute('required'));
                        document.getElementById('inlineWeatherAlert').style.display = 'none';
                    } else {
                        addressContainer.style.display = 'flex';
                        addressInputs.forEach(input => {
                            if (input.id !== 'chkLine2') input.setAttribute('required', 'true');
                        });
                        if (document.getElementById('chkCity').value) window.checkWeather();
                    }
                    updateTotals();
                });
            });
        });
        document.getElementById('chkCity').addEventListener('blur', window.checkWeather);
        document.getElementById('chkCountry').addEventListener('change', window.checkWeather);
        document.getElementById('chkPostal').addEventListener('blur', window.checkWeather);

        // NOUVEAU : Appel à l'API prévisions (forecast) ultra-précis basé sur le CODE POSTAL
        window.checkWeather = async () => {
            const city = document.getElementById('chkCity').value;
            const postalCode = document.getElementById('chkPostal').value;
            const country = document.getElementById('chkCountry').value;
            
            // On s'assure d'avoir au moins la ville pour lancer la recherche
            if (!city || city.length < 2) return;

            try {
                const API_KEY = '12e08b31287d3ae1e88369638b92d921'; // Remettre ta clé
                
                // 1. On interroge la destination (par code postal en priorité)
                let destUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${city},${country}&units=metric&lang=fr&appid=${API_KEY}`;
                
                if (postalCode) {
                    // Le paramètre "zip=" remplace "q="
                    destUrl = `https://api.openweathermap.org/data/2.5/forecast?zip=${postalCode},${country}&units=metric&lang=fr&appid=${API_KEY}`;
                }
                
                let destRes = await fetch(destUrl);
                
                // PLAN B : Si le code postal n'est pas reconnu par OpenWeatherMap, on retente avec le nom de la ville
                if (!destRes.ok && postalCode) {
                    destRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city},${country}&units=metric&lang=fr&appid=${API_KEY}`);
                }

                // 2. On interroge Nîmes directement par son code postal (30000)
                const nimesRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?zip=30000,FR&units=metric&lang=fr&appid=${API_KEY}`);
                
                if (!destRes.ok || !nimesRes.ok) return; 
                
                const destData = await destRes.json();
                const nimesData = await nimesRes.json();
                
                // Fonction pour extraire le min et max sur les 3 prochains jours (24 intervalles de 3h)
                const getExtremes = (data) => {
                    let minTemp = 100;
                    let maxTemp = -100;
                    const limit = Math.min(data.list.length, 24);
                    for (let i = 0; i < limit; i++) {
                        const temp = data.list[i].main.temp;
                        if (temp < minTemp) minTemp = temp;
                        if (temp > maxTemp) maxTemp = temp;
                    }
                    return { min: Math.round(minTemp), max: Math.round(maxTemp) };
                };

                const destTemps = getExtremes(destData);
                const nimesTemps = getExtremes(nimesData);

                const transitMinTemp = Math.min(nimesTemps.min, destTemps.min);
                const transitMaxTemp = Math.max(nimesTemps.max, destTemps.max);

                const alertBox = document.getElementById('inlineWeatherAlert');
                const alertTitle = document.getElementById('inlineWeatherTitle');
                const alertText = document.getElementById('inlineWeatherText');

                isColdWeather = false;
                isHotWeather = false;

                alertBox.style.display = 'block';

                if (transitMaxTemp >= 28) {
                    isHotWeather = true;
                    const hotspot = nimesTemps.max >= 28 ? "Nîmes" : city;
                    alertTitle.textContent = "Alerte Canicule ☀️";
                    alertText.innerHTML = `Des températures atteignant <strong>${transitMaxTemp}°C</strong> sont prévues à ${hotspot} dans les prochains jours.<br>Afin de préserver vos spécimens, les expéditions pourront être <strong>suspendues ou décalées</strong>.`;
                    alertBox.style.backgroundColor = '#fdf3f2'; 
                    alertBox.style.borderColor = '#eebdbb';
                    alertTitle.style.color = '#a35d5d';
                } 
                else if (transitMinTemp <= 10) {
                    isColdWeather = true;
                    alertTitle.textContent = "Alerte Grand Froid ❄️";
                    alertText.innerHTML = `Des températures descendant jusqu'à <strong>${transitMinTemp}°C</strong> sont prévues sur le trajet dans les jours à venir.<br>Pour garantir la survie de vos spécimens, une <strong>chaufferette (+${HEAT_PACK_COST.toFixed(2)}€)</strong> a été automatiquement ajoutée au prix de la livraison.`;
                    alertBox.style.backgroundColor = '#f0f4f8'; 
                    alertBox.style.borderColor = '#cce0f0';
                    alertTitle.style.color = '#4a7599';
                } 
                else {
                    alertTitle.textContent = "Conditions optimales 🌿";
                    alertText.innerHTML = `Les prévisions pour Nîmes et ${city} sur les prochains jours sont idéales !<br>Vos insectes voyageront dans les meilleures conditions.`;
                    alertBox.style.backgroundColor = '#f4f8f0'; 
                    alertBox.style.borderColor = '#d4e3c5';
                    alertTitle.style.color = '#4d5d30';
                }

                updateTotals(); 
            } catch (error) {
                console.error("Erreur API Météo Prévisions:", error);
            }
        };

        // NOUVEAU : Autocomplétion avec l'API Géo du gouvernement français
        const cityInput = document.getElementById('chkCity');
        const postalInput = document.getElementById('chkPostal');
        const countrySelect = document.getElementById('chkCountry');
        const cityDropdown = document.getElementById('cityDropdown');
        let debounceTimer;

        cityInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();
            const country = countrySelect.value;

            if (country !== 'FR' || query.length < 2) {
                cityDropdown.style.display = 'none';
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`https://geo.api.gouv.fr/communes?nom=${query}&fields=codesPostaux,departement&boost=population&limit=5`);
                    const data = await res.json();

                    if (data.length > 0) {
                        cityDropdown.innerHTML = '';
                        data.forEach(city => {
                            const li = document.createElement('li');
                            li.style.cssText = 'padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #eee; transition: background 0.2s; color: var(--accent-brown);';
                            const mainPostalCode = city.codesPostaux[0];
                            li.innerHTML = `<strong>${city.nom}</strong> <span style="color: #888; font-size: 0.85em;">(${mainPostalCode} - ${city.departement.nom})</span>`;
                            
                            li.onmouseover = () => li.style.background = '#f9f8f2';
                            li.onmouseout = () => li.style.background = 'white';

                            li.addEventListener('mousedown', (event) => {
                                event.preventDefault(); 
                                cityInput.value = city.nom;
                                postalInput.value = mainPostalCode; // NOUVEAU : Écrase et remplace systématiquement le code postal existant
                                cityDropdown.style.display = 'none';
                                window.checkWeather();
                            });
                            cityDropdown.appendChild(li);
                        });
                        cityDropdown.style.display = 'block';
                    } else {
                        cityDropdown.style.display = 'none';
                    }
                } catch (err) {
                    console.error("Erreur API Villes :", err);
                }
            }, 300); 
        });

        document.addEventListener('click', (e) => {
            if (e.target !== cityInput && e.target !== cityDropdown) {
                cityDropdown.style.display = 'none';
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '/connexion.html';
                return;
            }

            cart = JSON.parse(localStorage.getItem('terraophis_cart')) || [];
            subtotal = parseFloat(localStorage.getItem('terraophis_cart_total') || 0);

            if (cart.length === 0 || subtotal <= 0) {
                window.location.href = '/';
                return;
            }

            document.getElementById('chkName').value = user.displayName || '';
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (userSnap.exists()) {
                if (userSnap.data().phone) {
                    document.getElementById('chkPhone').value = userSnap.data().phone;
                }
                if (userSnap.data().address) {
                    const addr = userSnap.data().address;
                    document.getElementById('chkLine1').value = addr.line1 || '';
                document.getElementById('chkLine2').value = addr.line2 || '';
                document.getElementById('chkPostal').value = addr.postalCode || '';
                document.getElementById('chkCity').value = addr.city || '';
                document.getElementById('chkCountry').value = addr.country || 'FR';
                
                // NOUVEAU : Si l'adresse est pré-remplie, on vérifie la météo direct
                if (addr.city) window.checkWeather();
            }
            }

            const container = document.getElementById('checkoutItems');
            let html = '';
            let validCart = []; // NOUVEAU : Pour nettoyer le panier si besoin

            for (let i = 0; i < cart.length; i++) {
                if(cart[i].quantity <= 0) continue; // On ignore les articles à 0
                validCart.push(cart[i]);

                const pSnap = await getDoc(doc(db, "products", cart[i].id));
                const name = pSnap.exists() ? pSnap.data().name : "Spécimen";
                
                const itemLot = cart[i].lotSize;
                let itemPrice = pSnap.exists() ? pSnap.data().price : 0;
                
                if (pSnap.exists() && pSnap.data().prices && pSnap.data().prices[itemLot] !== undefined) {
                    itemPrice = pSnap.data().prices[itemLot];
                } else if (pSnap.exists()) {
                    if (itemLot === 5) itemPrice = pSnap.data().price5;
                    if (itemLot === 10) itemPrice = pSnap.data().price10;
                }

                const itemTotal = itemPrice * cart[i].quantity;
                const lotText = itemLot ? ` (Lot de ${itemLot})` : '';

                html += `
                    <div class="summary-item">
                        <span><strong>x${cart[i].quantity}</strong> ${name}${lotText}</span>
                        <span>${itemTotal.toFixed(2)} €</span>
                    </div>
                `;
            }
            container.innerHTML = html;

            // On sauvegarde le panier nettoyé
            if(validCart.length !== cart.length) {
                cart = validCart;
                localStorage.setItem('terraophis_cart', JSON.stringify(cart));
            }

            document.getElementById('chkSubtotal').textContent = subtotal.toFixed(2) + ' €';
            updateTotals(); 
        });

        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnFinalPay');
            btn.disabled = true;
            btn.textContent = 'CONNEXION SÉCURISÉE... ⏳';

            const user = auth.currentUser;
            
            // NOUVEAU : Récupération du mode et recalcul final
            const shippingMethod = document.querySelector('input[name="shippingMethod"]:checked').value;
            let currentShipping = 0;
            
            if (shippingMethod === 'colissimo') currentShipping = subtotal >= 100 ? 0 : 8.90;
            if (shippingMethod === 'chrono18') currentShipping = 14.90;
            if (isColdWeather && shippingMethod !== 'retrait') currentShipping += HEAT_PACK_COST;

            const totalWithShipping = subtotal + currentShipping;

            // NOUVEAU : On ignore l'adresse si c'est un retrait
            const shippingAddress = shippingMethod === 'retrait' ? null : {
                line1: document.getElementById('chkLine1').value,
                line2: document.getElementById('chkLine2').value,
                postalCode: document.getElementById('chkPostal').value,
                city: document.getElementById('chkCity').value,
                country: document.getElementById('chkCountry').value
            };

            try {
                // NOUVEAU : On sauvegarde toujours le téléphone dans le profil utilisateur
                const userUpdates = { phone: document.getElementById('chkPhone').value };
                if (shippingAddress) userUpdates.address = shippingAddress;
                await setDoc(doc(db, "users", user.uid), userUpdates, { merge: true });

                const orderRef = await addDoc(collection(db, "orders"), {
                    userId: user.uid,
                    customerEmail: user.email,
                    customerName: document.getElementById('chkName').value,
                    items: cart,
                    amountValue: totalWithShipping, 
                    shippingCost: currentShipping,
                    shippingMethod: shippingMethod, // NOUVEAU
                    status: 'En attente de paiement',
                    shippingAddress: shippingAddress,
                    hasHeatPack: (isColdWeather && shippingMethod !== 'retrait'),
                    weatherWarning: (shippingMethod !== 'retrait') ? (isHotWeather ? 'Canicule' : (isColdWeather ? 'Grand Froid' : 'OK')) : 'OK',
                    createdAt: serverTimestamp()
                });

                const response = await fetch('/api/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        orderId: orderRef.id,
                        userEmail: user.email
                    })
                });

                const data = await response.json();

                if (data.url) {
                    window.location.href = data.url;
                } else {
                    throw new Error(data.error || "Erreur de connexion à Stripe");
                }

            } catch (error) {
                console.error("Erreur Checkout :", error);
                alert("Une erreur est survenue.");
                btn.disabled = false;
                btn.textContent = 'PAYER MA COMMANDE';
            }
        });
    </script>
</body>
</html>
