<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>À Propos | Terraophis</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
    <style>
    .about-section { margin-bottom: 40px; }
    .about-section h2 { font-family: 'Playfair Display', serif; color: var(--accent-brown); font-size: 2.2rem; margin-bottom: 15px; }
    
    /* Grille auto-adaptative : s'ajuste seule selon le nombre d'images */
    .dynamic-gallery { 
        display: grid; 
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
        gap: 20px; 
        margin: 30px 0; 
    }
    .dynamic-gallery img { 
        width: 100%; 
        aspect-ratio: 16 / 10; 
        object-fit: cover; 
        border-radius: 12px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
    }
    
    /* Alignement côte à côte pour Passion & Objectif */
    .side-by-side-grid { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        gap: 40px; 
        margin: 40px 0; 
    }
    
    .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; margin-top: 30px; }
    .team-card { background: white; padding: 30px 20px; border-radius: 12px; border: 1px solid var(--border-light); text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
    .team-card img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 3px solid var(--primary-beige); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .team-card h3 { margin: 0 0 5px 0; font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--accent-brown); }
    .team-card p { margin: 0; font-size: 0.9rem; color: #666; line-height: 1.5; }
    
    @media (max-width: 768px) { 
        .side-by-side-grid { grid-template-columns: 1fr; gap: 30px; } 
    }
</style>
</head>
<body class="beige-theme">

    <nav class="navbar" id="main-navbar"></nav>

    <main class="container" style="margin: 60px auto 100px auto; max-width: 900px;">
        <h1 style="font-family: 'Playfair Display', serif; font-size: 3rem; text-align: center; margin-bottom: 50px; color: var(--accent-brown);">À Propos</h1>
        
        <div id="aboutContainer">
            <p style="text-align: center; font-style: italic;">Chargement de notre histoire... 🌿</p>
        </div>
    </main>

    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Votre Panier</h2>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItemsContainer"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total (hors frais de port)</span>
                <span id="cartTotalAmount">0.00 €</span>
            </div>
            <button class="btn-checkout" id="btnCheckout" onclick="processCheckout()">VALIDER LA COMMANDE</button>
        </div>
    </div>

    <footer id="main-footer"></footer>

    <script type="module" src="app.js"></script>
    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // NOUVEAU : Moteur de rendu du nouveau layout structuré de la page À Propos
async function loadAboutPage() {
    const container = document.getElementById('aboutContainer');
    try {
        const docSnap = await getDoc(doc(db, "settings", "aboutPage"));
        if (!docSnap.exists()) {
            container.innerHTML = '<p style="text-align:center;">Contenu en cours de configuration dans l\'espace admin.</p>';
            return;
        }
        
        const data = docSnap.data();
        
        // Construction de la galerie haute
        let topGalleryHtml = '';
        if (data.topGallery && data.topGallery.length > 0) {
            topGalleryHtml = `<div class="dynamic-gallery">` + data.topGallery.map(url => `<img src="${url}" alt="Terra Ophis">`).join('') + `</div>`;
        }
        
        // Construction de la galerie basse
        let bottomGalleryHtml = '';
        if (data.bottomGallery && data.bottomGallery.length > 0) {
            bottomGalleryHtml = `<div class="dynamic-gallery">` + data.bottomGallery.map(url => `<img src="${url}" alt="Terra Ophis">`).join('') + `</div>`;
        }
        
        // Construction du trombinoscope
        let teamHtml = '';
        if (data.members && data.members.length > 0) {
            teamHtml = `<div class="team-grid">` + data.members.map(m => `
                <div class="team-card">
                    <img src="${m.photo || 'assets/img/placeholder.jpg'}" alt="${m.name}">
                    <h3>${m.name}</h3>
                    <p>${m.role}</p>
                </div>
            `).join('') + `</div>`;
        }

        container.innerHTML = `
            <section class="about-section" style="text-align: center; max-width: 800px; margin: 0 auto 40px auto;">
                <h2>Notre équipe</h2>
                <div style="font-size: 1.05rem; line-height: 1.8; color: #4a4238;">${data.topTeamText || ''}</div>
            </section>

            ${topGalleryHtml}

            <div class="side-by-side-grid">
                <section class="about-section">
                    <h2>Une passion devenue projet</h2>
                    <div style="font-size: 1.05rem; line-height: 1.8; color: #4a4238;">${data.passionText || ''}</div>
                </section>
                
                <section class="about-section">
                    <h2>Notre objectif</h2>
                    <div style="font-size: 1.05rem; line-height: 1.8; color: #4a4238;">${data.objectifText || ''}</div>
                </section>
            </div>

            ${bottomGalleryHtml}

            <section class="about-section" style="margin-top: 60px;">
                <h2 style="text-align: center;">Notre équipe</h2>
                <div style="text-align: center; font-size: 1.05rem; line-height: 1.8; color: #4a4238; max-width: 800px; margin: 0 auto 30px auto;">${data.topTeamText || ''}</div>
                ${teamHtml}
            </section>
        `;
    } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="text-align:center;">Erreur lors du chargement.</p>';
    }
}
loadAboutPage();
    </script>
</body>
</html>
