<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conseils & Guides | Terraophis</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
</head>
<body class="beige-theme">

    <nav class="navbar" id="main-navbar"></nav>

    <main class="container">
        <header class="shop-header" style="margin: 40px 0; text-align: center;">
            <h1 style="font-family: 'Playfair Display', serif; font-size: 2.5rem;">Conseils & Guides</h1>
            <p style="color: #666; font-size: 1.1rem; max-width: 600px; margin: 0 auto;">Tout ce qu'il faut savoir pour élever et maintenir vos spécimens dans les meilleures conditions.</p>
        </header>

        <section class="products-section" style="background: transparent; border: none; box-shadow: none; padding: 0;">
            <div id="guidesGrid" class="guides-grid"></div>
        </section>
    </main>

    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Votre Panier</h2>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItemsContainer"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total (hors frais de port)</span>
                <span id="cartTotalAmount">0.00 €</span>
            </div>
            <button class="btn-checkout" id="btnCheckout" onclick="processCheckout()">VALIDER LA COMMANDE</button>
        </div>
    </div>

    <footer id="main-footer"></footer>
    <script type="module" src="app.js"></script>
</body>
</html>
